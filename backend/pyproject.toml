[project]
name = "manga-translator-backend"
version = "0.1.0"
description = "Local-first manga/manhua translation backend (FastAPI + worker)"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101", "S603", "S607", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
