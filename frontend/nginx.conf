# Unprivileged nginx: serves the built UI and proxies /api to the internal API service.
pid /tmp/nginx/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Whole-request budget. Must equal MT_MAX_UPLOAD_TOTAL_BYTES (default 256 MiB) of the API, which enforces
    # the same limit at the ASGI layer; nginx is the first gate so oversized bodies never reach the api
    # container's tmpfs. Raise both together, plus the api memory/tmpfs limits in compose.yaml.
    # Bodies are streamed to the API (proxy_request_buffering off below), so nothing is spooled here.
    client_max_body_size 256m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    map $sent_http_content_type $csp {
        default "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Static brand assets (SVG logo/favicon) built from frontend/public.
        location ~* ^/(logo|favicon)\.svg$ {
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
