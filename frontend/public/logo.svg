<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Manga Translator">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#064e3b"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- hexagonal badge -->
  <polygon points="48,3 88,25 88,71 48,93 8,71 8,25" fill="#0b0f0c" stroke="url(#g)" stroke-width="3"/>
  <polygon points="48,10 82,29 82,67 48,86 14,67 14,29" fill="none" stroke="#14532d" stroke-width="1"/>
  <!-- speed lines -->
  <g stroke="#166534" stroke-width="1.2" opacity="0.55">
    <line x1="20" y1="22" x2="30" y2="34"/><line x1="76" y1="22" x2="66" y2="34"/>
    <line x1="14" y1="48" x2="24" y2="48"/><line x1="82" y1="48" x2="72" y2="48"/>
  </g>
  <!-- cat ears -->
  <polygon points="26,38 30,16 44,30" fill="#111827" stroke="url(#g)" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="70,38 66,16 52,30" fill="#111827" stroke="url(#g)" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="30,34 32,23 40,30" fill="#16a34a" opacity="0.8"/>
  <polygon points="66,34 64,23 56,30" fill="#16a34a" opacity="0.8"/>
  <!-- face -->
  <circle cx="48" cy="52" r="22" fill="#f4f1ea" stroke="#0b0f0c" stroke-width="2"/>
  <!-- hair: spiky bangs -->
  <path d="M26,50 C24,32 36,24 48,25 C60,24 72,32 70,50 L64,40 L60,48 L54,36 L48,46 L42,36 L36,48 L32,40 Z" fill="#111827" stroke="url(#g)" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M30,44 L34,36 M62,44 L66,36" stroke="#4ade80" stroke-width="1.2" opacity="0.8"/>
  <!-- eyes -->
  <g filter="url(#glow)">
    <ellipse cx="39.5" cy="56" rx="5.2" ry="7" fill="url(#eye)" stroke="#052e16" stroke-width="1.2"/>
    <ellipse cx="56.5" cy="56" rx="5.2" ry="7" fill="url(#eye)" stroke="#052e16" stroke-width="1.2"/>
  </g>
  <ellipse cx="37.8" cy="53" rx="1.8" ry="2.4" fill="#fff"/>
  <ellipse cx="54.8" cy="53" rx="1.8" ry="2.4" fill="#fff"/>
  <circle cx="41.5" cy="59.5" r="0.9" fill="#fff" opacity="0.9"/>
  <circle cx="58.5" cy="59.5" r="0.9" fill="#fff" opacity="0.9"/>
  <!-- lashes / brows -->
  <path d="M34,48 Q39,45 45,48" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M51,48 Q57,45 62,48" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
  <!-- blush + mouth -->
  <ellipse cx="33" cy="63" rx="3" ry="1.6" fill="#f9a8d4" opacity="0.7"/>
  <ellipse cx="63" cy="63" rx="3" ry="1.6" fill="#f9a8d4" opacity="0.7"/>
  <path d="M45,67 Q48,70 51,67" fill="none" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/>
  <!-- speech bubble with 訳 -->
  <path d="M60,8 h26 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-14 l-6,6 v-6 h-6 a4,4 0 0 1 -4,-4 v-14 a4,4 0 0 1 4,-4 z" fill="#4ade80" stroke="#052e16" stroke-width="1.5"/>
  <text x="73" y="24" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#052e16">訳</text>
</svg>
